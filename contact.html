</head>
<body>

    <!-- Navigation Header -->
    <header>
        <div class="logo">Nica<span>Pajilan</span></div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="portfolio.html">Portfolio</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content -->
    <main>
        <h1 class="page-title">Contact Me</h1>
        <p class="page-subtitle">Feel free to reach out for school collaborations or inquiries.</p>

        <div class="contact-wrapper">
            <!-- Contact Details -->
            <section class="contact-info">
                <h3>Get In Touch</h3>
                <p><strong>Location:</strong><br>Pola, Oriental Mindoro</p>
                <p><strong>Email:</strong><br><a href="mailto:pajilannica@gmail.com">pajilannica@gmail.com</a></p>
                <p><strong>Facebook:</strong><br><a href="https://www.facebook.com/nwqcai" target="_blank">facebook.com/nwqcai</a></p>
            </section>

            <!-- Contact Form -->
            <section class="contact-form">
                <form action="#" method="post">
                    <div class="form-group">
                        <label for="name">Your Name</label>
                        <input type="text" id="name" name="name" placeholder="Enter your name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Your Email</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email" required>
                    </div>

                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5" placeholder="Write your message here..." required></textarea>
                    </div>

                    <button type="submit" class="btn">Send Message</button>
                </form>
            </section>
        </div>
    </main>

    <!-- Footer -->
    <footer>
